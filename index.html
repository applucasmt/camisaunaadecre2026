<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elegance Wear — Experiência 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👕</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header class="header" id="header">
  <div class="container header-inner">
    <a href="#" class="logo">ELEGANCE<span>·</span>WEAR</a>
  </div>
</header>

<!-- CONTAINER PRINCIPAL -->
<div class="scroll-container">
  
  <!-- SEÇÃO 1: INTRODUÇÃO (SEM 3D) -->
  <section class="scroll-section intro-section">
    <div class="content-box text-center visible">
      <span class="badge">COLEÇÃO 2026</span>
      <h1 id="heroTitle">ELEGANCE WEAR</h1>
      <p id="heroSub">A nova definição de estilo. Role para explorar cada modelo em 3D.</p>
      <div class="scroll-hint">Role para baixo ⌄</div>
    </div>
  </section>

  <!-- SEÇÃO 2: MODELO 1 -->
  <section class="scroll-section split-section" id="section-1">
    <div class="content-box align-left">
      <span class="eyebrow">MODELO 01</span>
      <h2 id="nome-1">Carregando...</h2>
      <p id="desc-1"></p>
    </div>
    <div class="canvas-container" id="canvas-1"></div>
  </section>

  <!-- SEÇÃO 3: MODELO 2 -->
  <section class="scroll-section split-section" id="section-2">
    <div class="content-box align-left">
      <span class="eyebrow">MODELO 02</span>
      <h2 id="nome-2">Carregando...</h2>
      <p id="desc-2"></p>
    </div>
    <div class="canvas-container" id="canvas-2"></div>
  </section>

  <!-- SEÇÃO 4: MODELO 3 -->
  <section class="scroll-section split-section" id="section-3">
    <div class="content-box align-left">
      <span class="eyebrow">MODELO 03</span>
      <h2 id="nome-3">Carregando...</h2>
      <p id="desc-3"></p>
      <button class="btn-primary" onclick="document.getElementById('lockBtn').click()">Editar Modelos</button>
    </div>
    <div class="canvas-container" id="canvas-3"></div>
  </section>

</div>

<!-- BOTÃO ADMIN E MODAIS (MANTIDOS) -->
<button class="lock-btn" id="lockBtn" title="Painel Admin">🔒</button>

<div class="modal" id="loginModal">
  <div class="modal-card">
    <h3>Painel Administrativo</h3>
    <p>Digite a senha de acesso.</p>
    <input type="password" id="senhaInput" placeholder="Senha">
    <div class="modal-actions">
      <button class="btn-ghost" data-close>Cancelar</button>
      <button class="btn-primary" id="loginBtn">Entrar</button>
    </div>
    <p class="error-msg" id="loginError"></p>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <h2>🎛️ Painel Administrativo</h2>
    <button class="btn-ghost" id="closeAdmin">Fechar</button>
  </div>
  <div class="admin-body">
    <div class="admin-sidebar" id="adminSidebar"></div>
    <div class="admin-content" id="adminContent"></div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
